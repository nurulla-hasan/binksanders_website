name: Compact preview fixer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-feedback-frontend-fixes
      - name: Align preview spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/super-admin/course/ModulePreview.tsx')
          text = path.read_text()
          replacements = [
            ('"m-2 flex min-h-0 flex-1 flex-col overflow-hidden shadow-sm animate-fadeIn"', '"flex min-h-0 h-full flex-1 flex-col overflow-hidden animate-fadeIn"'),
            (': "rounded-lg border border-secondary/50 bg-secondary p-4",', ': "bg-background",'),
            ('<div className="flex shrink-0 items-center gap-3 pb-4 pt-2">', '<div className="mb-4 rounded-b-xl bg-secondary px-4 py-3 shadow-sm">\n            <h2 className="mb-2 font-heading text-lg font-bold leading-tight text-foreground">\n              {title || "Course Title"}\n            </h2>\n            <div className="flex flex-col gap-1.5">\n              <div className="flex items-end justify-between">'),
            ('<span className="whitespace-nowrap text-xs font-bold text-secondary-foreground/80">\n              Q{currentIndex + 1}/{totalQuestions}\n            </span>\n            <Progress value={displayedProgress} className="h-1.5 flex-1" />\n          </div>', '<span className="rounded-sm bg-primary px-1.5 py-0.5 text-[10px] font-bold leading-none text-primary-foreground">\n                  Q{currentIndex + 1}/{totalQuestions}\n                </span>\n                <span className="text-[10px] font-bold leading-none text-foreground/80">\n                  {currentIndex + 1}/{totalQuestions}\n                </span>\n              </div>\n              <Progress value={displayedProgress} className="h-1.5 w-full rounded-full bg-background/50 [&>div]:bg-primary" />\n            </div>\n          </div>'),
            (': "space-y-5 rounded-sm bg-background/45 p-4 pr-2",', ': "space-y-4 pb-2",'),
            ('<div>\n              <span className="text-[10px] font-bold uppercase tracking-wider text-primary">', '<div className="mb-4 rounded-lg border border-primary/40 bg-primary/5 p-3 shadow-sm">\n              <span className="mb-3 inline-block rounded bg-primary px-1.5 py-0.5 text-[10px] font-bold uppercase text-primary-foreground shadow-sm">'),
            ('<h1 className="mt-2 font-heading text-xl font-bold leading-snug wrap-break-word">', '<h1 className="font-heading text-md font-semibold leading-snug text-foreground wrap-break-word">'),
            ('"min-w-0 rounded-sm border bg-background p-4 text-sm font-semibold wrap-break-word"', '"min-w-0 rounded-sm border bg-background p-3 text-sm font-medium wrap-break-word"'),
            ('"min-w-0 overflow-hidden rounded-sm border p-4 text-sm wrap-break-word"', '"min-w-0 overflow-hidden rounded-sm border p-3 text-sm wrap-break-word"'),
            ('className="min-w-0 rounded-sm border border-border bg-background p-4 text-sm wrap-break-word"', 'className="min-w-0 rounded-sm border border-border bg-background p-3 text-sm wrap-break-word"'),
            ('<div className="mt-5 shrink-0">', '<div className="mt-auto shrink-0 pt-4">'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing expected snippet: {old[:100]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit preview fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/super-admin/course/ModulePreview.tsx
          git commit -m "fix: align module preview spacing with survey runner"
          git push origin HEAD:client-feedback-frontend-fixes
