name: Ordering retry frontend fix

on:
  push:
    branches:
      - client-feedback-frontend-fixes
    paths:
      - ORDERING_RETRY_TRIGGER.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-feedback-frontend-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply ordering retry flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/survey/ModuleSurveyRunner.tsx')
          text = path.read_text()

          old = '''  const handleContinue = () => {
    if (!result) return;
'''
          new = '''  const handleRetryOrdering = () => {
    setResult(undefined);
  };

  const handleContinue = () => {
    if (!result) return;
'''
          if old not in text:
              raise SystemExit('handleContinue anchor not found')
          text = text.replace(old, new, 1)

          old = '''  const feedbackTitle = canShowCorrectAnswer
    ? result?.isCorrect === false
      ? "Not quite right"
'''
          new = '''  const isOrderingRetry =
    question.type === "Ordering" && result?.isCorrect === false;
  const feedbackTitle = canShowCorrectAnswer
    ? result?.isCorrect === false
      ? "Not quite right"
'''
          if old not in text:
              raise SystemExit('feedback anchor not found')
          text = text.replace(old, new, 1)

          old = '''                    {canShowCorrectAnswer &&
                      result.isCorrect === false &&
                      result.correctAnswer && (
                        <p className="mt-2 wrap-break-word font-medium">
                          Correct answer:{" "}
                          {Array.isArray(result.correctAnswer)
                            ? result.correctAnswer.join(" -> ")
                            : result.correctAnswer}
                        </p>
                      )}
'''
          new = '''                    {isOrderingRetry && (
                      <p className="mt-2 wrap-break-word font-medium">
                        Rearrange the items and try again.
                      </p>
                    )}
                    {canShowCorrectAnswer &&
                      !isOrderingRetry &&
                      result.isCorrect === false &&
                      result.correctAnswer && (
                        <p className="mt-2 wrap-break-word font-medium">
                          Correct answer:{" "}
                          {Array.isArray(result.correctAnswer)
                            ? result.correctAnswer.join(" -> ")
                            : result.correctAnswer}
                        </p>
                      )}
'''
          if old not in text:
              raise SystemExit('correct answer block not found')
          text = text.replace(old, new, 1)

          old = '''          {result ? (
            <Button size="lg" className="w-full" onClick={handleContinue}>
              {currentIndex === totalQuestions - 1 ||
              result.moduleStatus === "completed"
                ? "View result"
                : "Continue"}
              <ArrowRight />
            </Button>
          ) : (
'''
          new = '''          {result ? (
            isOrderingRetry ? (
              <Button
                size="lg"
                className="w-full"
                onClick={handleRetryOrdering}
              >
                Try again
                <ArrowRight />
              </Button>
            ) : (
              <Button size="lg" className="w-full" onClick={handleContinue}>
                {currentIndex === totalQuestions - 1 ||
                result.moduleStatus === "completed"
                  ? "View result"
                  : "Continue"}
                <ArrowRight />
              </Button>
            )
          ) : (
'''
          if old not in text:
              raise SystemExit('bottom action block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Remove temporary workflow files
        run: rm -f .github/workflows/ordering-retry-fix.yml ORDERING_RETRY_TRIGGER.txt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/survey/ModuleSurveyRunner.tsx .github/workflows/ordering-retry-fix.yml ORDERING_RETRY_TRIGGER.txt
          git commit -m "feat: retry ordering questions until correct"
          git push origin HEAD:client-feedback-frontend-fixes
